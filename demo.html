<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-list{
            display: flex;
            gap:20px;
            list-style-type: none;
            padding:0;
            margin:0;
            justify-content: center;
            align-items: center;
        }
        .flex-list li{
            border: 10px solid #20b939;
            padding: 40px;
            background-color: #c3d729;
            border-radius: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <ul class="flex-list">
  <li>RAKESH </li>
  <li>RAJESH </li>
  <li>SUNNY </li> 
  <li>BUNNY</li>
  <li>RONY </li>
  <li>ROCKY</li>
</ul>

</body>
</html>
